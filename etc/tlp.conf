# ----------------------------------------------------------------------------
# /etc/tlp.conf - TLP user configuration (Optimized for T14 Gen 1 AMD)
# ----------------------------------------------------------------------------

# Enable TLP
TLP_ENABLE=1
TLP_WARN_LEVEL=3
TLP_AUTO_SWITCH=2

# Profile Mapping
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL
TLP_PROFILE_DEFAULT=BAL

# Disk & Filesystem Optimizations
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# CPU Scaling Governors (Optimized for acpi-cpufreq on Zen 2 without CPPC)
CPU_SCALING_GOVERNOR_ON_AC=schedutil
CPU_SCALING_GOVERNOR_ON_BAT=schedutil
CPU_SCALING_GOVERNOR_ON_SAV=powersave

# Core Performance Boost (Allowed on AC and Battery, stripped on SAV)
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

# Hardware Platform Profiles (Lenovo ACPI platform profiles)
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# Drive Power Management
DISK_DEVICES="nvme0n1"
DISK_APM_LEVEL_ON_AC="254"
DISK_APM_LEVEL_ON_BAT="128"

# Graphics & Display Backlight Power Management
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto
RADEON_DPM_PERF_LEVEL_ON_SAV=low

# AMD Adaptive Backlight Modulation
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=2
AMDGPU_ABM_LEVEL_ON_SAV=4

# Connectivity & Audio Power Management
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
WOL_DISABLE=Y
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# Bus and USB Autosuspend
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersave
PCIE_ASPM_ON_SAV=powersupersave

RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_PHONE=0
USB_EXCLUDE_PRINTER=1

# Battery Care -- Charge thresholds
#START_CHARGE_THRESH_BAT0=75
#STOP_CHARGE_THRESH_BAT0=80
#RESTORE_THRESHOLDS_ON_BAT=1
