# ============================================================
# Chrome 152 - Ryzen 5 PRO 4650U / AMD Radeon iGPU
# Arch Linux + Hyprland / Wayland
# ============================================================

# --- Wayland ---
--ozone-platform=wayland

# --- GPU / Memory ---
--enable-zero-copy
--disable-font-subpixel-positioning
--disable-lcd-text

# --- Desktop integration ---
--password-store=gnome-libsecret
--enable-native-notifications
--enable-parallel-downloading

# --- Graphics / Rendering Backend ---
--use-gl=angle
--use-angle=gl

# --- Features (Combined on a single line) ---
--enable-features=WaylandWindowDecorations,WebRTCPipeWireCapturer,VaapiVideoDecoder,PlatformHEVCDecoderSupport,OverlayScrollbar
