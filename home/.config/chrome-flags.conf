# ============================================================
# Chrome 152 - Ryzen 5 PRO 4650U / AMD Radeon iGPU
# Arch Linux + Hyprland / Wayland
# ============================================================

# --- Wayland ---
--ozone-platform=wayland

# --- GPU / Memory ---
# Reduce unnecessary copies between CPU/system memory and GPU buffers.
--enable-zero-copy

# --- Desktop integration ---
--password-store=gnome-libsecret
--enable-native-notifications
--enable-parallel-downloading

# --- Wayland / Media / Graphics features ---
--enable-features=WaylandWindowDecorations,WebRTCPipeWireCapturer,VaapiVideoDecoder,PlatformHEVCDecoderSupport,Vulkan,VulkanFromANGLE,DefaultANGLEVulkan
