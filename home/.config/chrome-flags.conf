# --- Wayland & Display ---
--ozone-platform=wayland
--force-color-profile=srgb

# --- Font & Text Rendering ---
--enable-direct-composition
--enable-cleartype-dw-font-rendering
--font-cache-shared-handle
--enable-ui-borders

# --- GPU Acceleration & Rendering ---
--enable-gpu-rasterization
--enable-gpu-compositing
--enable-zero-copy
--enable-accelerated-2d-canvas

# --- System Integration ---
--password-store=gnome-libsecret
--enable-native-notifications
--enable-parallel-downloading

# --- Consolidated Features ---
--enable-features=WaylandWindowDecorations,WebRTCPipeWireCapturer,VaapiVideoDecoder,PlatformHEVCDecoderSupport,TouchpadOverscrollHistoryNavigation,CanvasOopRasterization,Vulkan,VulkanFromANGLE,DefaultANGLEVulkan
