# --- Wayland & Display ---
--ozone-platform=wayland
--disable-font-subpixel-positioning

# --- GPU Acceleration & Rendering ---
--enable-gpu-rasterization
--enable-gpu-compositing
--enable-zero-copy
--enable-accelerated-2d-canvas

# --- System Integration ---
--password-store=gnome-libsecret
--enable-native-notifications
--enable-parallel-downloading

# --- Consolidated Features ---
# Includes Wayland decorations, PipeWire screen sharing,
# AMD-specific hardware video decoding (HEVC/VP9),
# touchpad gesture navigation, Vulkan rendering, 
# and Out-of-Process Canvas Rasterization.
--enable-features=WaylandWindowDecorations,WebRTCPipeWireCapturer,VaapiVideoDecoder,PlatformHEVCDecoderSupport,TouchpadOverscrollHistoryNavigation,CanvasOopRasterization
