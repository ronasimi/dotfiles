# --- Wayland & Display ---
--ozone-platform=wayland
--disable-font-subpixel-positioning

# --- GPU Acceleration & Rendering ---
--enable-gpu-rasterization
--enable-gpu-compositing
--enable-zero-copy
--new-canvas-2d-api
--enable-accelerated-2d-canvas

# --- System Integration ---
--password-store=gnome-libsecret
--enable-native-notifications
--enable-parallel-downloading

# --- Consolidated Features ---
# Includes Wayland decorations, PipeWire screen sharing, 
# OOP Canvas rendering, AMD-specific hardware video decoding (HEVC/VP9),
# and touchpad gesture navigation.
--enable-features=WaylandWindowDecorations,WebRTCPipeWireCapturer,VaapiIgnoreDriverChecks,VaapiVideoDecoder,PlatformHEVCDecoderSupport,UseMultiPlaneFormatForHardwareVideo,TouchpadOverscrollHistoryNavigation
