<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

    <!-- 1. Global Rendering Settings (macOS Style) -->
    <match target="font">
        <!-- Enable anti-aliasing -->
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        
        <!-- Force greyscale rendering (disable RGB subpixel) -->
        <edit name="rgba" mode="assign"><const>none</const></edit>
        
        <!-- Disable hinting entirely -->
        <edit name="hinting" mode="assign"><bool>false</bool></edit>
        <edit name="autohint" mode="assign"><bool>false</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
        
        <!-- Disable LCD filter since we use greyscale -->
        <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    </match>

    <!-- 2. Apple Font Substitutions -->
    
    <!-- Default Sans-Serif -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Text</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Display</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>System San Francisco Display</string></edit>
    </match>

    <!-- Default Serif -->
    <match target="pattern">
        <test qual="any" name="family"><string>serif</string></test>
        <edit name="family" mode="prepend" binding="same"><string>New York</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Times New Roman</string></edit>
    </match>

    <!-- Default Monospace -->
    <match target="pattern">
        <test qual="any" name="family"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Mono</string></edit>
    </match>

    <!-- Default System-UI -->
    <match target="pattern">
        <test qual="any" name="family"><string>system-ui</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Text</string></edit>
    </match>

    <!-- 3. Reject Bitmap Fonts to ensure smooth scaling -->
    <selectfont>
        <rejectfont>
            <pattern>
                <patelt name="scalable"><bool>false</bool></patelt>
            </pattern>
        </rejectfont>
    </selectfont>

</fontconfig>
