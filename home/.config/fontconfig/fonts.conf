<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

    <!-- 1. Global Rendering Settings (True macOS Style - Zero Hinting / Pure AA) -->
    <match target="font">
        <!-- Enable anti-aliasing -->
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        
        <!-- Force greyscale rendering (macOS uses greyscale, never subpixel RGB on modern retina-style setups) -->
        <edit name="rgba" mode="assign"><const>none</const></edit>
        
        <!-- Completely disable hinting and autohinting for authentic macOS smooth scaling -->
        <edit name="hinting" mode="assign"><bool>false</bool></edit>
        <edit name="autohint" mode="assign"><bool>false</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
        
        <!-- Disable LCD filter since we use greyscale -->
        <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    </match>

    <!-- 2. Sans-Serif Fallback Chain (macOS SF Pro first) -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans-serif</string></test>
        <!-- Primary: Apple SF fonts -->
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Text</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Compact Text</string></edit>
        <!-- Fallbacks: Open source equivalents -->
        <edit name="family" mode="prepend" binding="same"><string>Noto Sans</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Liberation Sans</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Adwaita Sans</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
        <edit name="family" mode="append"><string>sans-serif</string></edit>
    </match>

    <!-- 3. Serif Fallback Chain (macOS New York first) -->
    <match target="pattern">
        <test qual="any" name="family"><string>serif</string></test>
        <!-- Primary: Apple serif -->
        <edit name="family" mode="prepend" binding="same"><string>New York</string></edit>
        <!-- Fallbacks: Open source equivalents -->
        <edit name="family" mode="prepend" binding="same"><string>Noto Serif</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Liberation Serif</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>DejaVu Serif</string></edit>
        <edit name="family" mode="append"><string>serif</string></edit>
    </match>

    <!-- 4. Monospace Fallback Chain (macOS SF Mono + Nerd Font for symbols) -->
    <match target="pattern">
        <test qual="any" name="family"><string>monospace</string></test>
        <!-- Primary: Nerd font variant for better symbol/glyph support -->
        <edit name="family" mode="prepend" binding="same"><string>Liga SFMono Nerd Font</string></edit>
        <!-- Fallback to vanilla SF Mono -->
        <edit name="family" mode="prepend" binding="same"><string>SF Mono</string></edit>
        <!-- Fallbacks: Open source equivalents -->
        <edit name="family" mode="prepend" binding="same"><string>Liberation Mono</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans Mono</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Adwaita Mono</string></edit>
        <edit name="family" mode="append"><string>monospace</string></edit>
    </match>

    <!-- 5. System-UI (CSS system-ui keyword) -->
    <match target="pattern">
        <test qual="any" name="family"><string>system-ui</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Text</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Noto Sans</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Liberation Sans</string></edit>
        <edit name="family" mode="append"><string>sans-serif</string></edit>
    </match>

    <!-- 6. UI-Rounded (CSS ui-rounded keyword) -->
    <match target="pattern">
        <test qual="any" name="family"><string>ui-rounded</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Rounded</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Noto Sans</string></edit>
        <edit name="family" mode="append"><string>sans-serif</string></edit>
    </match>

    <!-- 7. UI-Monospace (CSS ui-monospace keyword) -->
    <match target="pattern">
        <test qual="any" name="family"><string>ui-monospace</string></test>
        <edit name="family" mode="prepend" binding="same"><string>Liga SFMono Nerd Font</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Mono</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Liberation Mono</string></edit>
        <edit name="family" mode="append"><string>monospace</string></edit>
    </match>

    <!-- 8. UI-Serif (CSS ui-serif keyword) -->
    <match target="pattern">
        <test qual="any" name="family"><string>ui-serif</string></test>
        <edit name="family" mode="prepend" binding="same"><string>New York</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Noto Serif</string></edit>
        <edit name="family" mode="append"><string>serif</string></edit>
    </match>

    <!-- 9. Specific Font Substitutions (websites requesting specific fonts) -->
    
    <!-- Helvetica → SF Pro -->
    <match target="pattern">
        <test qual="any" name="family"><string>Helvetica</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Text</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Noto Sans</string></edit>
        <edit name="family" mode="append"><string>sans-serif</string></edit>
    </match>

    <!-- Arial → SF Pro -->
    <match target="pattern">
        <test qual="any" name="family"><string>Arial</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Text</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Liberation Sans</string></edit>
        <edit name="family" mode="append"><string>sans-serif</string></edit>
    </match>

    <!-- Times New Roman → New York -->
    <match target="pattern">
        <test qual="any" name="family"><string>Times New Roman</string></test>
        <edit name="family" mode="prepend" binding="same"><string>New York</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Noto Serif</string></edit>
        <edit name="family" mode="append"><string>serif</string></edit>
    </match>

    <!-- Courier → SF Mono -->
    <match target="pattern">
        <test qual="any" name="family"><string>Courier</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Mono</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Liberation Mono</string></edit>
        <edit name="family" mode="append"><string>monospace</string></edit>
    </match>

    <!-- Courier New → SF Mono -->
    <match target="pattern">
        <test qual="any" name="family"><string>Courier New</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Mono</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Liberation Mono</string></edit>
        <edit name="family" mode="append"><string>monospace</string></edit>
    </match>

    <!-- Consolas → SF Mono -->
    <match target="pattern">
        <test qual="any" name="family"><string>Consolas</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Mono</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Liberation Mono</string></edit>
        <edit name="family" mode="append"><string>monospace</string></edit>
    </match>

    <!-- Segoe UI → SF Pro -->
    <match target="pattern">
        <test qual="any" name="family"><string>Segoe UI</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Text</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro</string></edit>
        <edit name="family" mode="append"><string>sans-serif</string></edit>
    </match>

    <!-- Verdana → SF Pro -->
    <match target="pattern">
        <test qual="any" name="family"><string>Verdana</string></test>
        <edit name="family" mode="prepend" binding="same"><string>SF Pro Text</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Noto Sans</string></edit>
        <edit name="family" mode="append"><string>sans-serif</string></edit>
    </match>

    <!-- Georgia → New York -->
    <match target="pattern">
        <test qual="any" name="family"><string>Georgia</string></test>
        <edit name="family" mode="prepend" binding="same"><string>New York</string></edit>
        <edit name="family" mode="prepend" binding="same"><string>Noto Serif</string></edit>
        <edit name="family" mode="append"><string>serif</string></edit>
    </match>

    <!-- 10. Reject Bitmap Fonts -->
    <selectfont>
        <rejectfont>
            <pattern>
                <patelt name="scalable"><bool>false</bool></patelt>
            </pattern>
        </rejectfont>
    </selectfont>

</fontconfig>
