[main]
font=SF Pro Text:size=14
terminal=kitty
prompt="> "
layer=overlay
# This ensures it behaves like your Wofi list
show-actions=yes

[colors]
# #272727 with 45% opacity (73 in hex)
background=27272773
text=c3c3c3ff
# Your blue accent
match=8ab4f8ff
selection=8ab4f8ff
selection-text=1d1d1dff
# Border matches your clean look
border=8ab4f800

[border]
radius=10
width=0

[dmenu]
# Ensures multi-line content can wrap
mode=text
exit-immediately-if-empty=yes
