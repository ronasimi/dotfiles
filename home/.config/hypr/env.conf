env = XDG_CURRENT_DESKTOP,Hyprland

# Mouse cursor theme and size 
env = XCURSOR_THEME,capitaine-cursors-light
env = QT_CURSOR_THEME,captaine-cursors-light
env = HYPRCURSOR_THEME,captaine-cursors-light
env = HYPRCURSOR_SIZE,32
env = XCURSOR_SIZE, 32
env = QT_CURSOR_SIZE, 32

# Enable trash-cli for electron apps
env = ELECTRON_TRASH=trash-cli

# Set QT theme
env = QT_QPA_PLATFORMTHEME,qt6ct

# Set Libreoffice to use GTK for wayland
env = SAL_USE_VCLPLUGIN,gtk3

# Firefox flags
#export MOZ_DISABLE_RDD_SANDBOX=1
#export MOZ_X11_EGL=1
env = MOZ_USE_XINPUT2,1
env = MOZ_ENABLE_WAYLAND,1