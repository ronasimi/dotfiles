general {
    # This runs whenever loginctl lock-session is triggered
    lock_cmd = playerctl -p %any status 2>/dev/null | grep -q "Playing" && echo "was_playing" > /tmp/player_status || echo "paused" > /tmp/player_status; playerctl -p %any pause; pidof hyprlock || hyprlock
    
    # Automatically tell loginctl to lock the session before the computer sleeps
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on 
    on_unlock_cmd = [ "$(cat /tmp/player_status 2>/dev/null)" = "was_playing" ] && playerctl -p %any play

}

listener {
    # 3. A timeout of 0 acts as a global hook for your desktop session
    timeout = 0
    
    # 4. This fires the exact moment you unlock your machine
    on-resume = grep -q "was_playing" /tmp/player_status && (sleep 0.5 && playerctl -p %any play); rm -f /tmp/player_status
}


# lock screen
listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# turn off keyboard backlight, uncomment this section if have keyboard backlight.
listener { 
    timeout = 300                                          # 5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

# turn off screen
listener {
    timeout = 600                                 # 10min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}