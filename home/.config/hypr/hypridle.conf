general {
    # Lock instantly, run media script asynchronously
    lock_cmd = pidof hyprlock || (uwsm app -- hyprlock -grace 0 --immediate-render & $HOME/.config/hypr/scripts/media_pause.sh &)
    before_sleep_cmd = brightnessctl -sd rgb:kbd_backlight set 0; loginctl lock-session
    after_sleep_cmd = brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}