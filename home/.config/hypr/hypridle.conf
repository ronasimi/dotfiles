general {
    # 1. We put the entire loop directly inside lock_cmd so it triggers EVERY time the screen locks.
    # It scans, saves active players, pauses them, opens hyprlock, and then runs AFTER hyprlock closes to resume!
    lock_cmd = dash -c 'pidof hyprlock && exit 0; rm -f /tmp/active_players; for p in $(playerctl -l 2>/dev/null); do if [ "$(playerctl -p "$p" status 2>/dev/null)" = "Playing" ]; then pos1=$(playerctl -p "$p" position 2>/dev/null); sleep 0.2; pos2=$(playerctl -p "$p" position 2>/dev/null); if [ "$pos1" != "$pos2" ]; then echo "$p" >> /tmp/active_players; fi; fi; done; playerctl -a pause; uwsm app -- hyprlock -grace 0 --immediate-render; if [ -f /tmp/active_players ]; then for p in $(cat /tmp/active_players); do playerctl -p "$p" play 2>/dev/null; done; rm -f /tmp/active_players; fi'
    
    # 2. Keep this bound to loginctl to handle proper OS deep sleep cycles
    before_sleep_cmd = loginctl lock-session
}

# NOTE: You can completely delete or comment out the old listener { timeout = 0 } block!
# The lock_cmd string itself handles the resume function automatically upon unlock.


# lock screen
listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# turn off keyboard backlight, uncomment this section if have keyboard backlight.
listener { 
    timeout = 300                                          # 5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

# turn off screen
listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session, hyprctl dispatch dpms off            # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}