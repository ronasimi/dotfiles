general {
    # 1. Save screen and keyboard backlight states before launching hyprlock
    lock_cmd = brightnessctl g > /tmp/user_bl && brightnessctl -d tpacpi::kbd_backlight g > /tmp/user_kbd && (pidof hyprlock || (~/.config/hypr/scripts/media_pause.sh & uwsm app -- hyprlock --immediate-render))
    
    # 2. Restore explicitly tracked user states on unlock (added screen restore)
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' ; brightnessctl set $(cat /tmp/user_bl 2>/dev/null) ; brightnessctl -d tpacpi::kbd_backlight set $(cat /tmp/user_kbd 2>/dev/null)
    
    # 3. Trigger lock session (which executes lock_cmd above and saves states)
    before_sleep_cmd = loginctl lock-session
    
    # 4. Wake display, wait for tpacpi initialization, then restore tracked states
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' ; sleep 2 ; brightnessctl set $(cat /tmp/user_bl 2>/dev/null) ; brightnessctl -d tpacpi::kbd_backlight set $(cat /tmp/user_kbd 2>/dev/null)
}

listener {
    timeout = 300                                                                         # 5min
    on-timeout = ~/.config/hypr/scripts/media_pause.sh & loginctl lock-session            # pause media and lock screen when timeout has passed
}

listener {
    timeout = 330                                                                         # 5.5min
    # Save screen and kbd state, wait for screenshot, then screen off and kbd off
    on-timeout = brightnessctl g > /tmp/idle_bl && brightnessctl -d tpacpi::kbd_backlight g > /tmp/idle_kbd && sleep 0.5 && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })' && brightnessctl -d tpacpi::kbd_backlight set 0
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' ; brightnessctl -d tpacpi::kbd_backlight set $(cat /tmp/idle_kbd 2>/dev/null)
}
