general {
    ignore_dbus_inhibit = true

    # Prevent multiple lockscreen instances. Capture media state once before Hyprlock;
    # media_pause.sh exits immediately and leaves no resident media watcher.
    lock_cmd = flock -n /tmp/hyprlock.lock -c 'pidof hyprlock >/dev/null || ($HOME/.config/hypr/scripts/media_pause.sh pause; exec hyprlock --immediate-render)'

    # Resume only players that were active before locking, then restore DPMS.
    on_unlock_cmd = $HOME/.config/hypr/scripts/media_pause.sh resume; hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # loginctl emits the lock event handled by lock_cmd above.
    before_sleep_cmd = loginctl lock-session

    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    # Turn off display
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
