general {
    hide_cursor = true
}

auth {
    fingerprint:enabled = false
}

background {
    monitor =
    path = /tmp/hyprlock_bg.png   # only png supported for now
    color = rgba(13131300)

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 0 # 0 disables blurring
    blur_size = 3
    noise = 0.0234
}

image {
    monitor =
    path = /home/ron/.face
    size = 256 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 0
    position = 0, 128
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 256, 48
    outline_thickness = 0
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = false
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba(13131388)
    inner_color = rgba(13131388)
    font_color = rgb(7f7f7f)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input password for $USER</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 9 # -1 means complete rounding (circle/oval)
    check_color = rgb(272727)
    fail_color =  rgb(ac4142) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = rgb(ac4142)
    numlock_color = rgb(ac4142)
    bothlock_color = rgb(ac4142) # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off

    position = 0, -164
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(7f7f7f)
    font_size = 72
    font_family = SF Pro Display

    position = 32, 96
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:600000] echo "<span foreground='##7f7f7f'>$(date +"%A, %B %d %Y")</span>"
    color = rgb(7f7f7f)
    font_size = 32
    font_family = SF Pro Display
    position = 32, 32
    halign = left
    valign = bottom
}
