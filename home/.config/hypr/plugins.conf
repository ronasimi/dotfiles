# Hyprgrass plugin settings
plugin {
    touch_gestures {
     # The default sensitivity is probably too low on tablet screens,
     # I recommend turning it up to 4.0
     sensitivity = 1.0
   
     # must be >= 3
     workspace_swipe_fingers = 3
   
     # switching workspaces by swiping from an edge, this is separate from workspace_swipe_fingers
     # and can be used at the same time
     # possible values: l, r, u, or d
     # to disable it set it to anything else
     workspace_swipe_edge = none
   
     # in milliseconds
     long_press_delay = 400
   
     # resize windows by long-pressing on window borders and gaps.
     # If general:resize_on_border is enabled, general:extend_border_grab_area is used for floating
     # windows
     resize_on_border_long_press = true
   
     # in pixels, the distance from the edge that is considered an edge
     edge_margin = 10
   
     # emulates touchpad swipes when swiping in a direction that does not trigger workspace swipe.
     # ONLY triggers when finger count is equal to workspace_swipe_fingers
     #
     # might be removed in the future in favor of event hooks
     emulate_touchpad_swipe = true

     # swipe left from right edge
     hyprgrass-bind = , edge:r:l, workspace, +1

     # swipe up from bottom edge
     hyprgrass-bind = , edge:d:u, dispatcher, togglespecialworkspace

     # longpress can trigger mouse binds:
     hyprgrass-bindm = , longpress:2, movewindow
     hyprgrass-bindm = , longpress:3, resizewindow
   
     experimental {
       # send proper cancel events to windows instead of hacky touch_up events,
       # NOT recommended as it crashed a few times, once it's stabilized I'll make it the default
       send_cancel = 0
     }
    }
   }

   # Hypexpo plugin settings
   plugin {
    hyprexpo {
        columns = 3
        gap_size = 18
        bg_col = rgb(272727)
        workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1
        scrolling:scroll_moves_up_down = true # if false, scroll left/right to switch workspaces, if true, scroll up/down to switch workspaces
        gesture_distance = 300 # how far is the "max" for the gesture
    }
  }

    # Hyprspace plugin settings
    plugin {
     overview {
          panelHeight = 256
          panelBorderwidth = 0
          hideRealLayers = false
          hideTopLayers = true
          hideOverlayLayers = true
          centerAligned = true
          onBottom = true
          autoDrag = true
          panelColor = rgba(29, 29, 29, 0.8)
          panelBorderColor = rgba(29, 29, 29, 0.8)
          workspaceActiveBackground = rgba(39, 39, 39, 0.8)
          workspaceInactiveBackground = rgba(29, 29, 29, 0.8)
          workspaceBorderSize = 3
          workspaceActiveBorder = rgba(138, 180, 248, 0.8)
          workspaceInactiveBorder = rgba(29, 29, 29, 0.8)
          dragAlpha = 0.8
          disableBlur = true
          drawActiveWorkspace = true
          affectStrut = false
          exitOnSwitch = true
          showEmptyWorkspaces = true
     }
    }