# Hyprland Window/layer rules configuration file
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# information about window rules and their options.

# Layer rules
layerrule {
  name = layerrule-1
  blur = on
  animation = slide
  match:namespace = waybar
}

layerrule {
  name = layerrule-2
  blur = on
  animation = slide
  match:namespace = wofi
}

# Window rules
windowrule {
  name = windowrule-1
  workspace = 4
  match:class = ^(code-url-handler)$
}

windowrule {
  name = windowrule-2
  workspace = 4
  match:class = ^(org.gnome.Meld)$
}

windowrule {
  name = windowrule-3
  workspace = 5
  match:class = ^(gimp|gimp-3.0)$
}

windowrule {
  name = windowrule-4
  workspace = 6
  match:class = ^(Vmware)$
}

windowrule {
  name = windowrule-5
  workspace = 7
  match:class = ^(libreoffice|libreoffice-startcenter|libreoffice-writer|libreoffice-calc|Soffice)$
}

windowrule {
  name = windowrule-6
  workspace = 8
  match:class = ^(PrusaSlicer)$
}

windowrule {
  name = windowrule-7
  float = on
  match:class = ^(dunst)$
}

windowrule {
  name = windowrule-8
  float = on
  pin = on
  animation = windowsIn, 1, 3, grav, fade
  animation = windowsOut, 1, 3, grav, fade
  match:class = ^(super-enter)$
}

