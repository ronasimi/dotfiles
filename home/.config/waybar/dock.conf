{
    "layer": "top",
    "position": "bottom",
    "exclusive": false,
    "margin-bottom": 12,
    "modules-center": [
        "wlr/taskbar"
    ],
    "wlr/taskbar": {
        "format": "{icon}",
        "icon-size": 36,
        "icon-theme": "Papirus", 
        "tooltip-format": "{title}",
        "on-click": "activate",
        "on-click-middle": "close",
        "on-click-right": "fullscreen",
        "ignore-list": [
            "kitty-scratchpad"
        ]
    }
}