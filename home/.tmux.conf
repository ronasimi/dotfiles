# Remove ESC key delay to eliminate terminal blocking and speed up mode switching
set-option -sg escape-time 10

# Enable focus events for modern terminal tools to recognize window focus changes
set-option -g focus-events on

# Terminals and overrides
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Interface and limits
set -g status on
set -g history-limit 10000
set -g mouse on
set-option -g set-titles on
set-option -g set-titles-string "#W"
set-option -g automatic-rename on

# Navigation and scrolling bindings
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Theme layout execution
source-file "${HOME}/.tmux-themepack/basic.tmuxtheme"
